<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTM 大模型论文周报 - 索引</title>
    <!--
      索引页采用动态加载：
        1. 通过 GitHub Contents API 自动列出当前目录下 YYYY-MM-DD.html 的所有报告；
        2. 拉取每份报告 <head> 中的 <script type="application/json" id="report-meta"> 元数据；
        3. 按日期倒序渲染卡片，最新一份自动打上"最新"徽章。

      新增一份周报时无需修改本文件，只需：
        - 新建 YYYY-MM-DD.html，在 <head> 中加入 <script type="application/json" id="report-meta">{...}</script>
        - 推送到 GitHub 即可。
    -->
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #667eea;
            --text: #333;
            --text-light: #666;
            --bg: #f8f9fa;
            --card-bg: #fff;
            --border: #e0e0e0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text);
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        header h1 {
            font-size: 2.5em;
            margin-bottom: 12px;
        }
        header p {
            font-size: 1.1em;
            opacity: 0.85;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }
        .card a {
            text-decoration: none;
            color: inherit;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--primary);
        }
        .card-date {
            background: var(--accent);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
            white-space: nowrap;
        }
        .card-meta {
            color: var(--text-light);
            font-size: 0.95em;
            margin-bottom: 16px;
        }
        .card-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card-stat {
            background: var(--bg);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.9em;
        }
        .card-stat .number {
            font-weight: 700;
            color: var(--accent);
        }
        .latest-badge {
            display: inline-block;
            background: #ea4335;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            margin-left: 10px;
        }
        .status {
            text-align: center;
            color: rgba(255,255,255,0.95);
            padding: 40px 20px;
            font-size: 1em;
        }
        .status.error {
            background: rgba(255,255,255,0.95);
            color: #b00020;
            border-radius: 12px;
            padding: 24px;
        }
        .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        footer {
            text-align: center;
            padding: 30px;
            color: rgba(255,255,255,0.7);
            font-size: 0.9em;
        }
        @media (max-width: 600px) {
            header h1 { font-size: 1.8em; }
            .card-header { flex-direction: column; }
            .card-stats { gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>VTM 大模型论文周报</h1>
            <p>每周精选 arXiv 及业界重要论文，覆盖 Agentic、RAG、预训练、后训练、强化学习、架构创新等方向</p>
        </header>

        <div id="report-list">
            <div class="status">
                <div class="spinner"></div>
                <div>正在加载报告列表…</div>
            </div>
        </div>

        <footer>
            <p>VTM 大模型论文周报 | 由 VTM 小助手自动生成</p>
        </footer>
    </div>

    <script>
    (function () {
        // 默认指向当前部署的仓库；如仓库改名，只需改这里一行即可。
        const DEFAULT_REPO = 'yuanyuan25/yuanyuan25.github.io';
        const DEFAULT_DIR = 'llm_reports';
        const FILE_PATTERN = /^\d{4}-\d{2}-\d{2}\.html$/;
        const listEl = document.getElementById('report-list');

        // 部署在 <user>.github.io 时自动推断仓库；其它情况回退到默认值。
        function detectRepoAndDir() {
            const host = location.host;
            const segs = location.pathname.split('/').filter(Boolean);
            if (segs.length && /\.html?$/i.test(segs[segs.length - 1])) segs.pop();
            const m = host.match(/^([^.]+)\.github\.io$/);
            if (m) {
                const user = m[1];
                // 项目页：<user>.github.io/<repo>/... ；用户页：<user>.github.io/...
                // 简单策略：路径首段当作仓库名优先尝试，失败再回退到用户页 / 默认值。
                if (segs.length) {
                    return [
                        { repo: `${user}/${segs[0]}`, dir: segs.slice(1).join('/') },
                        { repo: `${user}/${user}.github.io`, dir: segs.join('/') },
                        { repo: DEFAULT_REPO, dir: DEFAULT_DIR },
                    ];
                }
                return [
                    { repo: `${user}/${user}.github.io`, dir: '' },
                    { repo: DEFAULT_REPO, dir: DEFAULT_DIR },
                ];
            }
            return [{ repo: DEFAULT_REPO, dir: DEFAULT_DIR }];
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // summary 内允许 <br>，其它一律转义
        function safeSummary(str) {
            return escapeHtml(str).replace(/&lt;br\s*\/?&gt;/gi, '<br>');
        }

        function showError(msg) {
            listEl.innerHTML = `<div class="status error">${escapeHtml(msg)}</div>`;
        }

        async function listReportFiles() {
            const candidates = detectRepoAndDir();
            let lastErr = null;
            for (const { repo, dir } of candidates) {
                const url = `https://api.github.com/repos/${repo}/contents/${dir}`;
                try {
                    const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
                    if (!res.ok) {
                        lastErr = new Error(`HTTP ${res.status} @ ${repo}/${dir}`);
                        continue;
                    }
                    const items = await res.json();
                    if (!Array.isArray(items)) {
                        lastErr = new Error(`非目录响应 @ ${repo}/${dir}`);
                        continue;
                    }
                    const files = items
                        .filter(it => it.type === 'file' && FILE_PATTERN.test(it.name))
                        .map(it => it.name);
                    if (files.length) return files;
                    lastErr = new Error(`目录为空 @ ${repo}/${dir}`);
                } catch (e) {
                    lastErr = e;
                }
            }
            throw lastErr || new Error('无法找到报告目录');
        }

        async function fetchMeta(filename) {
            try {
                const res = await fetch(filename, { cache: 'no-cache' });
                if (!res.ok) return null;
                const html = await res.text();
                const m = html.match(/<script[^>]*id=["']report-meta["'][^>]*>([\s\S]*?)<\/script>/i);
                if (!m) return null;
                const meta = JSON.parse(m[1].trim());
                meta.file = filename;
                meta.date = meta.date || filename.replace(/\.html$/, '');
                return meta;
            } catch (e) {
                console.warn(`解析 ${filename} 元数据失败：`, e);
                return null;
            }
        }

        function renderCard(meta, isLatest) {
            const stats = (meta.stats || []).map(s =>
                `<div class="card-stat"><span class="number">${escapeHtml(s.value)}</span> ${escapeHtml(s.label)}</div>`
            ).join('');
            const badge = isLatest ? '<span class="latest-badge">最新</span>' : '';
            const week = meta.week ? `<div class="card-date">${escapeHtml(meta.week)}</div>` : '';
            const summary = meta.summary ? `<div class="card-meta">${safeSummary(meta.summary)}</div>` : '';
            return `
                <div class="card">
                    <a href="${escapeHtml(meta.file)}">
                        <div class="card-header">
                            <div class="card-title">${escapeHtml(meta.title || meta.date)}${badge}</div>
                            ${week}
                        </div>
                        ${summary}
                        <div class="card-stats">${stats}</div>
                    </a>
                </div>
            `;
        }

        async function init() {
            try {
                const files = await listReportFiles();
                if (!files.length) {
                    showError('暂无报告。');
                    return;
                }
                const metas = (await Promise.all(files.map(fetchMeta))).filter(Boolean);
                if (!metas.length) {
                    showError('未能从任何报告中解析到元数据。请确认报告 <head> 中包含 <script id="report-meta"> 块。');
                    return;
                }
                metas.sort((a, b) => b.date.localeCompare(a.date));
                listEl.innerHTML = metas.map((m, i) => renderCard(m, i === 0)).join('');
            } catch (err) {
                console.error(err);
                showError(`加载失败：${err.message}。可能是 GitHub API 速率限制（每小时 60 次），请稍后重试。`);
            }
        }

        init();
    })();
    </script>
</body>
</html>
