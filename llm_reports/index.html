    </div>
    <noscript><p class="status">请启用 JavaScript 查看完整报告目录，也可以<a href="2026-09-07.html">阅读 2026-09-07 的报告</a>。</p></noscript>
  </main>
  <footer class="site-footer"><div class="shell footer-inner"><p>知行手记 · Yuan’s Notes</p><p>记录所学，沉淀所思。</p></div></footer>
    <script>
    (function () {
        const MANIFEST = 'reports.json';
        const listEl = document.getElementById('report-list');

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // summary 内允许 <br>，其它一律转义
        function safeSummary(str) {
            return escapeHtml(str).replace(/&lt;br\s*\/?&gt;/gi, '<br>');
        }

        function showError(msg) {
            listEl.innerHTML = `<div class="status error">${escapeHtml(msg)}</div>`;
        }

        function renderCard(meta, isLatest) {
            const stats = (meta.stats || []).map(s =>
                `<div class="card-stat"><span class="number">${escapeHtml(s.value)}</span> ${escapeHtml(s.label)}</div>`
            ).join('');
            const badge = isLatest ? '<span class="latest-badge">最新</span>' : '';
            const week = meta.week ? `<div class="card-date">${escapeHtml(meta.week)}</div>` : '';
            const summary = meta.summary ? `<div class="card-meta">${safeSummary(meta.summary)}</div>` : '';
            return `
                <div class="card">
                    <a href="${escapeHtml(meta.file)}">
                        <div class="card-header">
                            <div class="card-title">${escapeHtml(meta.title || meta.date)}${badge}</div>
                            ${week}
                        </div>
                        ${summary}
                        <div class="card-stats">${stats}</div>
                    </a>
                </div>
            `;
        }

        async function init() {
            try {
                const res = await fetch(MANIFEST, { cache: 'no-cache' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const metas = await res.json();
                if (!Array.isArray(metas) || !metas.length) {
                    showError('暂无报告。');
                    return;
                }
                metas.forEach(m => { m.date = m.date || (m.file || '').replace(/\.html$/, ''); });
                metas.sort((a, b) => String(b.date).localeCompare(String(a.date)));
                listEl.innerHTML = metas.map((m, i) => renderCard(m, i === 0)).join('');
            } catch (err) {
                console.error(err);
                showError(`加载失败：${err.message}。请确认 reports.json 存在（运行 build_index.py 生成）。`);
            }
        }

        init();
    })();
    </script>
</body>
</html>
