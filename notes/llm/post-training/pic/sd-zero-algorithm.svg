<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 46px; font-weight: 760; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 25px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 30px; font-weight: 720; fill: #0f172a; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 25px; font-weight: 720; fill: #0f172a; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 21px; fill: #334155; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; fill: #475569; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 16px; fill: #64748b; }
      .formula { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 20px; fill: #1e293b; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 17px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #dbe3ef; stroke-width: 2; filter: url(#soft-shadow); }
      .blue-card { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; filter: url(#soft-shadow); }
      .green-card { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; filter: url(#soft-shadow); }
      .orange-card { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; filter: url(#soft-shadow); }
      .purple-card { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 2; filter: url(#soft-shadow); }
      .red-card { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; filter: url(#soft-shadow); }
      .dash { stroke-dasharray: 9 9; }
      .arrow-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .arrow-orange { stroke: #d97706; stroke-width: 4; fill: none; marker-end: url(#arrow-orange); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 4; fill: none; marker-end: url(#arrow-purple); }
      .muted-line { stroke: #cbd5e1; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1200"/>

  <text class="title" x="70" y="74">SD-Zero：把二元奖励变成稠密 token 级自监督</text>
  <text class="subtitle" x="72" y="113">同一个模型先学会“看着自己的答案和对错信号进行修订”，再把修订器的分布蒸馏回生成器。</text>

  <rect x="70" y="150" width="1660" height="108" rx="14" class="card"/>
  <text class="section-title" x="100" y="188">输入约束</text>
  <text class="text" x="100" y="224">只有题目 x、最终答案 a、二元验证器 r(y,a) ∈ {0,1}</text>
  <rect x="725" y="184" width="250" height="45" rx="22" fill="#dcfce7"/>
  <text class="badge" x="766" y="213" fill="#047857">无需外部教师</text>
  <rect x="1018" y="184" width="270" height="45" rx="22" fill="#ffedd5"/>
  <text class="badge" x="1050" y="213" fill="#c2410c">只有二元奖励</text>
  <rect x="1330" y="184" width="300" height="45" rx="22" fill="#eef2ff"/>
  <text class="badge" x="1360" y="213" fill="#4338ca">无需高质量示范</text>

  <rect x="70" y="300" width="790" height="610" rx="18" class="blue-card"/>
  <text class="section-title" x="105" y="344">Phase 1：SRT，自修订训练</text>
  <text class="small" x="105" y="376">目标：先把模型训练成一个可用的 Reviser。</text>

  <rect x="110" y="416" width="250" height="88" rx="12" class="card"/>
  <text class="box-title" x="134" y="452">1. Generator</text>
  <text class="small" x="134" y="481">Base model 生成初稿 y_init</text>

  <rect x="445" y="416" width="250" height="88" rx="12" class="orange-card"/>
  <text class="box-title" x="470" y="452">2. Binary Verifier</text>
  <text class="small" x="470" y="481">只判断最终答案对/错</text>

  <rect x="275" y="552" width="320" height="124" rx="12" class="purple-card"/>
  <text class="box-title" x="304" y="590">3. Outcome Prompt</text>
  <text class="small" x="304" y="620">r = 1：Let me rephrase</text>
  <text class="small" x="304" y="649">r = 0：Wait, start over</text>

  <rect x="110" y="724" width="250" height="92" rx="12" class="green-card"/>
  <text class="box-title" x="134" y="760">4. Reviser</text>
  <text class="small" x="134" y="789">看 x、y_init、r 后生成 y_revised</text>

  <rect x="445" y="724" width="250" height="92" rx="12" class="green-card"/>
  <text class="box-title" x="470" y="760">5. Filter</text>
  <text class="small" x="470" y="789">只保留修订后正确的 trace</text>

  <rect x="250" y="844" width="360" height="44" rx="22" fill="#dbeafe"/>
  <text class="formula" x="290" y="873">L_SRT = L_revision + L_generation</text>

  <path class="arrow-blue" d="M360 460 C390 460 410 460 445 460"/>
  <path class="arrow-orange" d="M570 504 C570 530 548 546 512 558"/>
  <path class="arrow-purple" d="M355 676 C300 698 260 710 232 724"/>
  <path class="arrow-green" d="M360 770 C392 770 414 770 445 770"/>
  <path class="arrow-blue" d="M570 816 C570 832 548 844 518 848"/>

  <text class="tiny" x="112" y="890">训练结果：SRT 模型显式学会 self-revision，但回答会变长。</text>

  <rect x="940" y="300" width="790" height="610" rx="18" class="green-card"/>
  <text class="section-title" x="975" y="344">Phase 2：On-policy Self-Distillation</text>
  <text class="small" x="975" y="376">目标：把 Reviser 的修订能力蒸馏回单次生成。</text>

  <rect x="990" y="416" width="260" height="100" rx="12" class="card"/>
  <text class="box-title" x="1018" y="452">1. Student Generator</text>
  <text class="small" x="1018" y="482">当前模型对 x 生成 y</text>

  <rect x="1342" y="416" width="260" height="100" rx="12" class="orange-card"/>
  <text class="box-title" x="1370" y="452">2. Verifier</text>
  <text class="small" x="1370" y="482">得到 r = 0 或 1</text>

  <rect x="1010" y="620" width="285" height="116" rx="12" class="card"/>
  <text class="box-title" x="1036" y="657">Student distribution</text>
  <text class="formula" x="1036" y="690">π_S(· | x, y_&lt;t)</text>

  <rect x="1376" y="620" width="285" height="116" rx="12" class="purple-card"/>
  <text class="box-title" x="1402" y="657">Teacher Reviser</text>
  <text class="formula" x="1402" y="690">π_T(· | x,y,r,y_&lt;t)</text>
  <text class="tiny" x="1402" y="718">冻结的 SRT model</text>

  <rect x="1116" y="790" width="430" height="82" rx="12" class="blue-card"/>
  <text class="box-title" x="1156" y="826">3. Dense token supervision</text>
  <text class="formula" x="1156" y="856">min KL(π_S || stopgrad(π_T))</text>

  <path class="arrow-green" d="M1250 466 C1282 466 1310 466 1342 466"/>
  <path class="arrow-orange" d="M1472 516 C1472 560 1496 585 1518 620"/>
  <path class="arrow-blue" d="M1120 516 C1120 560 1144 586 1152 620"/>
  <path class="arrow-purple" d="M1295 678 C1325 678 1348 678 1376 678"/>
  <path class="arrow-blue" d="M1152 736 C1180 764 1210 780 1240 790"/>
  <path class="arrow-purple" d="M1518 736 C1490 764 1460 780 1430 790"/>

  <path class="arrow-green dash" d="M1546 838 C1648 840 1668 620 1600 548 C1558 502 1522 500 1498 516"/>
  <text class="tiny" x="1548" y="570">可选：Teacher Sync</text>
  <text class="tiny" x="1548" y="594">学生变强后同步为新 teacher</text>

  <text class="tiny" x="978" y="900">训练结果：生成器内化修订，直接产出更短、更准、更主动避坑的答案。</text>

  <rect x="70" y="950" width="1660" height="180" rx="18" class="card"/>
  <text class="section-title" x="105" y="994">为什么它比 RLVR / 普通蒸馏更省样本？</text>

  <rect x="105" y="1028" width="480" height="72" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text class="box-title" x="132" y="1060">RLVR / GRPO</text>
  <text class="small" x="132" y="1088">只有整条回答的 0/1 奖励，信号稀疏，需要多 rollout。</text>

  <rect x="660" y="1028" width="480" height="72" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="box-title" x="687" y="1060">普通 Distillation / SDFT</text>
  <text class="small" x="687" y="1088">有 token 级密集监督，但依赖外部教师或高质量示范。</text>

  <rect x="1215" y="1028" width="480" height="72" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text class="box-title" x="1242" y="1060">SD-Zero</text>
  <text class="small" x="1242" y="1088">只用二元 verifier，让自己的 Reviser 生成 token 级监督。</text>

  <path class="muted-line" d="M585 1064 C620 1064 625 1064 660 1064"/>
  <path class="muted-line" d="M1140 1064 C1175 1064 1180 1064 1215 1064"/>

  <text class="tiny" x="72" y="1164">核心闭环：先显式学会修改错误，再把“如何修改”的分布蒸馏成一次性生成能力。</text>
</svg>
